<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Лабораторна 4 (Завдання 2)</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        padding: 20px;
      }
      h2 {
        color: #333;
      }
      code {
        background-color: #f4f4f4;
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 1.1em;
        display: block; /* Робимо кожен вивід у своєму рядку */
        margin-bottom: 15px;
        /* Дозволяємо перенос довгих рядків */
        word-wrap: break-word;
      }
      .highlight {
        color: red;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>Результати виконання скрипту (lab4_2)</h2>

    <script>
      // 1. Формування масиву (15 випадкових елементів)
      let arr = [];
      const N = 15; // Кількість елементів (не менше 15)

      // Генеруємо випадкові числа, наприклад, від 0 до 99
      for (let i = 0; i < N; i++) {
        arr.push(Math.floor(Math.random() * 100));
      }

      document.write("<h3>Початковий масив (15 елементів):</h3>");
      document.write("<code>" + arr.join(" ") + "</code>");

      // ----------------------------------------------------

      // 2. Пошук мінімального елемента та його індексу (без вбудованих функцій)

      // Припускаємо, що перший елемент є мінімальним
      let minVal = arr[0];
      let minIndex = 0;

      // Починаємо цикл з другого елемента (індекс 1),
      // оскільки ми вже взяли перший (індекс 0)
      for (let i = 1; i < arr.length; i++) {
        if (arr[i] < minVal) {
          minVal = arr[i];
          minIndex = i;
        }
      }

      document.write(
        "<p>Знайдено мінімальний елемент: <b>" +
          minVal +
          "</b> (на позиції з індексом " +
          minIndex +
          ").</p>"
      );
      document.write(
        "<p>Третій елемент масиву (індекс 2): <b>" + arr[2] + "</b>.</p>"
      );

      // ----------------------------------------------------

      // 3. Обмін місцями мінімального та третього (індекс 2) елементів

      // Важливо: перевіряємо, чи minIndex не дорівнює 2.
      // Якщо minIndex === 2, то обмін не потрібен,
      // але код нижче все одно спрацює коректно (поміняє елемент сам із собою).

      // Використовуємо класичний обмін через тимчасову змінну
      let temp = arr[2]; // Зберігаємо третій елемент
      arr[2] = arr[minIndex]; // Ставимо на 3-тє місце мінімальний елемент
      arr[minIndex] = temp; // Ставимо на місце min елемента збережений 3-й елемент

      // ----------------------------------------------------

      // 4. Виведення результату

      document.write(
        "<h3>Масив після обміну мінімального (<b>" +
          minVal +
          "</b>) та третього елементів:</h3>"
      );

      // Для наочності підсвітимо елементи, які були змінені
      let output = "";
      for (let i = 0; i < arr.length; i++) {
        if (i === 2 || i === minIndex) {
          // Виділяємо змінені позиції
          output += '<span class="highlight">' + arr[i] + "</span> ";
        } else {
          output += arr[i] + " ";
        }
      }

      document.write("<code>" + output + "</code>");
    </script>
  </body>
</html>
